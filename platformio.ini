; ESP32-S3-DevKitC-1 PlatformIO project — LED Timecode Sync firmware
; Default target: N8 (8MB Flash, no PSRAM)
; If your board has PSRAM (N8R8 / N16R8), switch to env:esp32-s3-devkitc-1-n8r8
;
; LED data pin: set -DLED_DATA_GPIO=N per env to match wiring.
; LED chipset default: WS2811 (400 kHz). Override in device config led_type or
;   -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B for compile-time WS2812B default.
;   Config values: "WS2811" | "WS2812B"
; Production: 1024 logical LEDs across up to five outputs.
;   （原為 640。5P 專案 5 個 output 的 logical 總數已達 640 上限，
;     為了容納 820 顆而上調；成本只有 (1024-640)*3 = 1152 bytes RAM。）

[platformio]
; N16R8 是主要穿戴板型 (16MB Flash, 原生 USB, 5 通道 WS2812B)
; 與 scripts/fw.sh 的 DEFAULT_ENV 一致
default_envs = esp32-s3-devkitc-1-n16r8

[env]
; pin 版本：避免 toolchain / Arduino core 飄移導致燒錄與編譯行為不可重現
platform = espressif32 @ ~7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7
; Serial console + Device Manager commands use the onboard USB-UART bridge
; (e.g. /dev/cu.wchusbserial* on macOS). Do NOT enable USB CDC here unless you
; connect the DevKitC-1 native "USB" port and use that serial device instead.
build_flags =
    -DTIMECODE_HOLD_MS=500
    -DTIMECODE_BLACKOUT_MS=2000
; src/tools/ 放的是獨立的診斷 sketch（各自有自己的 setup/loop），一律排除在
; 主韌體之外，否則會與 main.cpp 撞成 multiple definition of `setup()`。
; 只有 env:led-test 會覆寫這個 filter 去編譯它。
build_src_filter = +<*> -<tools/>

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8
    ; Mac USB 供電實測成功配置: 2dBm + 跳過 self-test + 1000ms settle
    ; 現場演出: 外部電源 + 移除這些旗標 + 改用 =17
    -DWIFI_TX_POWER_DBM=2
    -DLED_DISABLE_BOOT_SELFTEST

; Classic ESP32 DevKit (4MB Flash) — Studio Device Manager board target "ESP32 DevKit"
; GPIO 8 is flash-strapped on ESP32 (invalid for FastLED); MAX_EVENTS capped for ~320KB RAM.
[env:esp32-dev]
board = esp32dev
board_build.partitions = partitions-esp32.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DMAX_EVENTS=256
    ; USB 開發實測成功配置
    -DWIFI_TX_POWER_DBM=2
    -DLED_DISABLE_BOOT_SELFTEST

; Smaller LED buffer for compile/test without 500-LED hardware
[env:esp32-s3-devkitc-1-test]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8
    -DLED_COUNT_MAX=10
    -DMAX_EVENTS=64
    ; USB 開發實測成功配置
    -DWIFI_TX_POWER_DBM=2
    -DLED_DISABLE_BOOT_SELFTEST

; N8R8 variant: 8MB Flash + 8MB OPI PSRAM
[env:esp32-s3-devkitc-1-n8r8]
board = esp32-s3-devkitc-1
; qio_opi = QIO flash + Octal PSRAM，R8（8MB PSRAM）模組就是這個組合
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; 韌體用 LittleFS 存 device config（src/config_storage.cpp），沒有這行
; PlatformIO 會當成 SPIFFS，掛載行為與其他 env 不一致
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8
    -DBOARD_HAS_PSRAM
    ; USB 開發實測成功配置
    -DWIFI_TX_POWER_DBM=2
    -DLED_DISABLE_BOOT_SELFTEST

; N16R8 variant: 16MB Flash + 8MB PSRAM，接「原生 USB」埠（/dev/cu.usbmodem*）
;
; 用 esptool flash_id 對實機確認過：
;   Detected flash size: 16MB
;   Features: Embedded PSRAM 8MB (AP_3v3)
;   Flash type set in eFuse: quad (4 data lines)
;   USB mode: USB-Serial/JTAG
;
; 這個 env 刻意「不」啟用 PSRAM：韌體目前完全沒用到（RAM 66% 用的是內部
; SRAM），開啟 memory_type / BOARD_HAS_PSRAM 只是多一個會影響開機的變因。
; 之後真的需要 PSRAM 時再單獨加回來並實機驗證。
[env:esp32-s3-devkitc-1-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; 用專案自己的 partitions.csv，不用 default_16MB.csv。
;
; 原因：這塊板子的 board 定義是 esp32-s3-devkitc-1（N8 / 8MB），flash_size
; 只是被 board_upload 撐成 16MB。default_16MB.csv 把 spiffs 放在 0xc90000
; （13.2MB 處），實機上 LittleFS 掛載與格式化都失敗：
;   esp_littlefs: Corrupted dir pair at {0x0, 0x1}
;   mount failed, (-84) → formatting... → 仍然失敗
;   → [config] using embedded default config
; 於是上傳的 config 無處可存，板子永遠跑內建預設值（沒有任何 event），
; 表現為「時間同步正常但 LED 完全不亮」。
;
; partitions.csv 的 spiffs 在 0x210000、6.2MB，位置落在 8MB 範圍內，
; 而且 esp32-s3-devkitc-1 env 一直用它且運作正常。容量對本專案綽綽有餘
; （firmware 824KB、config JSON 約 17KB）。
board_build.partitions = partitions.csv
; 韌體用 LittleFS 存 device config（src/config_storage.cpp）
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B
    ; CRGB _leds[LED_COUNT_MAX] 是靜態配置（src/led_driver.h）。上調到 1024 讓
    ; 5 個 output 的 logical 總數可以超過原本的 640 上限。
    ; 改這裡務必同步改 led-studio/src/shared/eventValidator.ts 的
    ; FIRMWARE_LED_COUNT_MAX，兩邊各自編譯、沒有共用常數。
    -DLED_COUNT_MAX=1024
    ; 這塊板子接的是原生 USB-Serial/JTAG 埠而不是 USB-UART 橋接晶片。
    ; 不開 CDC 的話 Serial 會送到 UART0，/dev/cu.usbmodem* 上收不到任何
    ; 應用層輸出，Device Manager 的指令也永遠等不到回應（Serial timeout）。
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; 降低 WiFi 發射功率以避免 Mac/PC USB 供電時的欠壓重啟。
    ; 實機驗證成功配置 (Mac USB):
    ;   - WIFI_TX_POWER_DBM=2 (極低功率)
    ;   - LED_DISABLE_BOOT_SELFTEST (跳過 self-test 省電)
    ;   - WIFI_POWER_SETTLE_MS=1000 (預設,電容充電)
    ;   - esp_wifi_set_max_tx_power() (三層確認)
    ; 結果: wifi=connected, RSSI=-60..-62, heap=89996, 穩定運行
    ; 範圍約 1-2m, 僅適用桌面開發。
    ; 現場演出: 外部 5V/1A 電源 + 移除以下兩個旗標,改用 =17
    -DWIFI_TX_POWER_DBM=2
    -DLED_DISABLE_BOOT_SELFTEST
    ; LED 總電流上限（mA @5V）。FastLED 會動態壓低亮度讓合計電流不超過它。
    ;
    ; 為什麼需要：實測拿到 Reset reason: brownout (9)。max_brightness 只縮放
    ; 「亮著的部分」，擋不住同時全亮的尖峰；這個旗標才是硬天花板。
    ;
    ; 算法：這條電軌的電源額定 × 0.8（線損與電源餘裕）
    ;   目前 LED 是獨立的 5V/3A 行動電源 → 3000 × 0.8 = 2400
    ;
    ; 注意「這條電軌」：ESP32 目前是從 Mac 的 USB 取電，不在行動電源上
    ; （板子只出訊號線與 GND 給燈條），所以不必從這裡扣它的 500mA 尖峰。
    ; 之後若改成 ESP32 也吃行動電源，這個值要再扣 500 → 1900。
    ;
    ; 880 顆的電流帳（每顆全白 60mA、單色 20mA、IC 待機 0.8mA）：
    ;   全滅 0.7A（與亮度無關）／單色@0.25 約 4.4A／全白@0.25 約 13.2A
    ; 也就是 3A 電源本來就餵不動 880 顆的高亮度畫面 —— 這個上限是讓它
    ; 「變暗但不重開」，不是讓它變得夠亮。換更大的電源才是根治。
    ;
    ; 換電源後記得改這裡：5V/10A → 7500
    -DLED_MAX_MILLIAMPS=2400

; 判別假說 2-B：WiFi/UDP 常駐是否干擾 FastLED 的 RMT 訊號（表現為只亮第一顆）。
; 這個 env 與 n16r8 完全相同，只是不啟動 WiFi。燒錄後整條燈應呈橙色脈動；
; 若 nowifi 正常而正式版只亮第一顆，即確認 WiFi 中斷干擾 RMT。
;   ./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8-nowifi
[env:esp32-s3-devkitc-1-n16r8-nowifi]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; 與 n16r8 同值，否則兩者 RMT 傳輸長度不同，假說 2-B 的比對不成立。
    -DLED_COUNT_MAX=1024
    -DDIAG_DISABLE_WIFI

; 實驗：改用 ESP-IDF 內建 RMT driver（一次性轉譯整條資料，不靠中斷 refill），
; 犧牲 RAM 換取對 WiFi 中斷的免疫力。僅在假說 2-B 成立時採用為正式設定。
;   ./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8-rmtbuiltin
[env:esp32-s3-devkitc-1-n16r8-rmtbuiltin]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; 這裡刻意不跟著上調到 1024：builtin driver 會為每顆 LED 配置 24 個
    ; rmt_item32_t（約 96 bytes/顆），1024 顆等於 ~98KB RAM。先維持 types.h
    ; 的預設 640 驗證假說，確定要採用為正式設定時再評估 RAM 是否吃得下。
    -DFASTLED_RMT_BUILTIN_DRIVER=1

; 開關接線驗證韌體：確認 GPIO 10 的自鎖開關接對了，再燒正式韌體。
; 接錯 NO/NC 的症狀（開機就進本機模式）跟程式邏輯寫錯一模一樣，
; 先用這支把接線單獨驗證掉，之後有問題就能確定是軟體側。
; 這支會把 local_trigger.cpp 一起編進來，所以順便驗證 debounce 實作。
;   ./scripts/fw.sh upload switch-check
;   ./scripts/fw.sh monitor
; 測完燒回主韌體：./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8
[env:switch-check]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; 只編驗證 sketch 與它要測的 local_trigger，其餘 src/ 全部排除
build_src_filter = -<*> +<tools/switch_check.cpp> +<local_trigger.cpp>
build_flags =
    ; 接原生 USB 埠時必須開 CDC，否則看不到任何 log
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 最小 LED 測試韌體：只驅動單一 GPIO，不碰 config / WiFi / timeline / 多輸出。
; 用於「主韌體回報 self-test 完成但燈不亮」時，把軟體層整層排除。
;   ./scripts/fw.sh upload led-test
;   ./scripts/fw.sh monitor
; 測完燒回主韌體：./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8
[env:led-test]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; 只編譯測試檔，排除 src/ 其餘所有程式（否則會有兩個 setup/loop）
build_src_filter = -<*> +<tools/led_blink_test.cpp>
build_flags =
    ; 接原生 USB 埠時必須開 CDC，否則看不到任何 log
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_GPIO=4
    -DTEST_COUNT=120
    -DTEST_BRIGHTNESS=50

; 腳位識別韌體：一次只點亮一支 GPIO，每支腳配固定顏色，用眼睛就能讀出
; 「哪條燈帶接在哪支腳」。led-droop-test 證明帽子燈條不在 GPIO 4 之後用它定位。
;   GPIO4=紅  GPIO5=綠  GPIO6=藍  GPIO7=黃  GPIO15=白
;   ./scripts/fw.sh upload led-gpio-identify
;   ./scripts/fw.sh monitor
; 測完燒回主韌體：./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8
[env:led-gpio-identify]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/led_gpio_identify.cpp>
build_flags =
    ; 接原生 USB 埠時必須開 CDC，否則看不到任何 log
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DIDENT_COUNT=300

; 壓降 vs 訊號 判別韌體：把「電流大小」與「訊號要走的距離」拆開測，
; 用來分辨「設定 300 顆但只亮前半段」是供電掉壓、資料訊號劣化、還是燈帶不夠長。
; 主韌體的 self-test（繞過 timeline/parts）同樣只亮前半段時使用。
;   ./scripts/fw.sh upload led-droop-test
;   ./scripts/fw.sh monitor
; 測完燒回主韌體：./scripts/fw.sh upload esp32-s3-devkitc-1-n16r8
[env:led-droop-test]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/led_droop_test.cpp>
build_flags =
    ; 接原生 USB 埠時必須開 CDC，否則看不到任何 log
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_GPIO=4
    -DTEST_COUNT=300

; RAW GPIO 方波測試：不走 FastLED，把 GPIO 當一般輸出以 1Hz 切換。
; 用來把「腳位有沒有在輸出」與「WS2812B 通訊」徹底分開 ——
; 800kHz 的 WS2812B 訊號用萬用電表量不到，1Hz 方波可以。
;   ./scripts/fw.sh upload led-test-raw
[env:led-test-raw]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/led_blink_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_GPIO=4
    -DTEST_COUNT=120
    -DTEST_BRIGHTNESS=50
    -DTEST_RAW_GPIO

; 同一支最小測試韌體，但改用 GPIO 8 —— 那是 env:esp32-s3-devkitc-1 的
; LED_DATA_GPIO，也就是使用者回報「之前能正常顯示燈色」時的接線腳位。
; 用來驗證問題是否出在 GPIO 4 這支腳的訊號品質。
;   ./scripts/fw.sh upload led-test-gpio8
[env:led-test-gpio8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/led_blink_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_GPIO=8
    -DTEST_COUNT=120
    -DTEST_BRIGHTNESS=50

; GPIO4 全 60 顆判別 env：無 WiFi 的最小韌體。若這個 env 也只亮第一顆，
; 問題在硬體（電平轉換/供電/第一顆 DOUT），軟體側停手。
;   ./scripts/fw.sh upload led-test-gpio4-60
[env:led-test-gpio4-60]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/led_blink_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_GPIO=4
    -DTEST_COUNT=60
    -DTEST_BRIGHTNESS=30

; GPIO 掃描測試：輪流測試多個 GPIO，找出正確的腳位
; 會依序測試 GPIO 4,5,6,7,8,15,16,17,18,21，每個腳位顯示 8 秒
;   ./scripts/fw.sh upload gpio-scanner
[env:gpio-scanner]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/gpio_scanner.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTEST_COUNT=60
    -DTEST_BRIGHTNESS=50

; GPIO 掃描測試 - 標準 ESP32-S3 版本（使用 USB-UART 橋接晶片，不是原生 USB）
; 適用於標準 ESP32-S3-DevKitC-1 (8MB Flash, 無 PSRAM)
;   ./scripts/fw.sh upload gpio-scanner-s3
[env:gpio-scanner-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
build_src_filter = -<*> +<tools/gpio_scanner.cpp>
build_flags =
    ${env.build_flags}
    -DTEST_COUNT=60
    -DTEST_BRIGHTNESS=50

; GPIO 掃描測試 - 標準 ESP32 版本（舊款 ESP32，4MB Flash）
; 適用於 ESP32-DevKitC / NodeMCU-32S 等標準 ESP32 開發板
; 注意：ESP32 的 GPIO 6,7,8 是 Flash 腳位，改測試 4,5,12-19,21-23
;   ./scripts/fw.sh upload gpio-scanner-esp32
[env:gpio-scanner-esp32]
board = esp32dev
board_build.partitions = partitions-esp32.csv
build_src_filter = -<*> +<tools/gpio_scanner_esp32.cpp>
build_flags =
    ${env.build_flags}
    -DTEST_COUNT=60
    -DTEST_BRIGHTNESS=50
