; ESP32-S3-DevKitC-1 PlatformIO project — LED Timecode Sync firmware
; Default target: N8 (8MB Flash, no PSRAM)
; If your board has PSRAM (N8R8 / N16R8), switch to env:esp32-s3-devkitc-1-n8r8
;
; LED data pin: set -DLED_DATA_GPIO=N to match your wiring (default 8 = placeholder).
; LED chipset default: WS2811 (400 kHz). Override in device config led_type or
;   -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B for compile-time WS2812B default.
;   Config values: "WS2811" | "WS2812B"
; Production: 500 LEDs. Dev compile without hardware: use env:esp32-s3-devkitc-1-test.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7
; Native USB CDC serial (USB port labeled "USB" on DevKitC-1)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_DATA_GPIO=8
; Timecode packet loss: continue on local clock up to 500ms, blackout after 2000ms
    -DTIMECODE_HOLD_MS=500
    -DTIMECODE_BLACKOUT_MS=2000

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Smaller LED buffer for compile/test without 500-LED hardware
[env:esp32-s3-devkitc-1-test]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_DATA_GPIO=8
    -DLED_COUNT_MAX=10
    -DMAX_EVENTS=64

; N8R8 variant: 8MB Flash + 8MB OPI PSRAM
[env:esp32-s3-devkitc-1-n8r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
