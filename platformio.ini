; ESP32-S3-DevKitC-1 PlatformIO project — LED Timecode Sync firmware
; Default target: N8 (8MB Flash, no PSRAM)
; If your board has PSRAM (N8R8 / N16R8), switch to env:esp32-s3-devkitc-1-n8r8
;
; LED data pin: set -DLED_DATA_GPIO=N per env to match wiring.
; LED chipset default: WS2811 (400 kHz). Override in device config led_type or
;   -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B for compile-time WS2812B default.
;   Config values: "WS2811" | "WS2812B"
; Production: 640 logical LEDs across up to five outputs.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7
; Serial console + Device Manager commands use the onboard USB-UART bridge
; (e.g. /dev/cu.wchusbserial* on macOS). Do NOT enable USB CDC here unless you
; connect the DevKitC-1 native "USB" port and use that serial device instead.
build_flags =
    -DTIMECODE_HOLD_MS=500
    -DTIMECODE_BLACKOUT_MS=2000

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8

; Classic ESP32 DevKit (4MB Flash) — Studio Device Manager board target "ESP32 DevKit"
; GPIO 8 is flash-strapped on ESP32 (invalid for FastLED); MAX_EVENTS capped for ~320KB RAM.
[env:esp32-dev]
board = esp32dev
board_build.partitions = partitions-esp32.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DMAX_EVENTS=256

; Smaller LED buffer for compile/test without 500-LED hardware
[env:esp32-s3-devkitc-1-test]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8
    -DLED_COUNT_MAX=10
    -DMAX_EVENTS=64

; N8R8 variant: 8MB Flash + 8MB OPI PSRAM
[env:esp32-s3-devkitc-1-n8r8]
board = esp32-s3-devkitc-1
; qio_opi = QIO flash + Octal PSRAM，R8（8MB PSRAM）模組就是這個組合
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; 韌體用 LittleFS 存 device config（src/config_storage.cpp），沒有這行
; PlatformIO 會當成 SPIFFS，掛載行為與其他 env 不一致
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=8
    -DBOARD_HAS_PSRAM

; N16R8 variant: 16MB Flash + 8MB PSRAM，接「原生 USB」埠（/dev/cu.usbmodem*）
;
; 用 esptool flash_id 對實機確認過：
;   Detected flash size: 16MB
;   Features: Embedded PSRAM 8MB (AP_3v3)
;   Flash type set in eFuse: quad (4 data lines)
;   USB mode: USB-Serial/JTAG
;
; 這個 env 刻意「不」啟用 PSRAM：韌體目前完全沒用到（RAM 66% 用的是內部
; SRAM），開啟 memory_type / BOARD_HAS_PSRAM 只是多一個會影響開機的變因。
; 之後真的需要 PSRAM 時再單獨加回來並實機驗證。
[env:esp32-s3-devkitc-1-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; 韌體用 LittleFS 存 device config（src/config_storage.cpp）
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLED_DATA_GPIO=4
    -DLED_CHIPSET_DEFAULT=LED_CHIPSET_WS2812B
    ; 這塊板子接的是原生 USB-Serial/JTAG 埠而不是 USB-UART 橋接晶片。
    ; 不開 CDC 的話 Serial 會送到 UART0，/dev/cu.usbmodem* 上收不到任何
    ; 應用層輸出，Device Manager 的指令也永遠等不到回應（Serial timeout）。
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
